<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Dashboard</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:1180px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px}.login{max-width:420px;margin:100px auto}.login input,.composer textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:10px}.login button,.btn{padding:10px 14px;border:0;border-radius:10px;background:#0f172a;color:#fff;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.queue{max-height:72vh;overflow:auto}.item{padding:14px;border-bottom:1px solid #e2e8f0;cursor:pointer}.item:hover,.item.active{background:#f1f5f9}.pill{font-size:11px;font-weight:700;background:#e2e8f0;padding:4px 8px;border-radius:999px}.msgs{height:48vh;overflow:auto;background:#f8fafc;border-radius:12px;padding:12px}.msg{padding:10px 12px;margin:8px 0;border-radius:12px;max-width:78%}.user{background:#dbeafe}.assistant{background:#e2e8f0}.agent{background:#dcfce7;margin-left:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px}.composer{margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.muted{color:#64748b;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="loginBox" class="login card"><h2>Agent Login</h2><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button onclick="doLogin()">Sign in</button><p id="err"></p></div><div id="app" class="wrap hidden"><div class="top"><div><h1>Support Dashboard</h1><div id="who" class="muted"></div></div><button class="btn" onclick="logout()">Log out</button></div><div id="stats" class="stats"></div><div class="grid"><div class="card queue"><h3>Conversation Queue</h3><div id="rows"></div></div><div class="card"><div id="empty">Select a conversation.</div><div id="panel" class="hidden"><div class="top"><div><h3 id="title"></h3><div id="meta" class="muted"></div></div><span id="status" class="pill"></span></div><div class="actions"><button class="btn" onclick="claim()">Claim</button><button class="btn" onclick="setStatus('RESOLVED')">Resolve</button><button class="btn" onclick="setStatus('BOT_ACTIVE')">Return to bot</button></div><div id="msgs" class="msgs"></div><div class="composer"><textarea id="reply" rows="3" placeholder="Reply as an agent..."></textarea><button class="btn" onclick="sendReply()">Send reply</button></div></div></div></div></div><script>let token=localStorage.agentToken||'',me=JSON.parse(localStorage.agentUser||'null'),selected=null;const loginBox=document.getElementById('loginBox'),appBox=document.getElementById('app');const auth=()=>({authorization:'Bearer '+token});async function doLogin(){const r=await fetch('/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(!r.ok){err.textContent='Invalid credentials';return}const j=await r.json();token=j.access_token;me={username:j.username,role:j.role};localStorage.agentToken=token;localStorage.agentUser=JSON.stringify(me);await show()}function logout(){localStorage.removeItem('agentToken');localStorage.removeItem('agentUser');location.reload()}async function show(){const r=await fetch('/agent/conversations',{headers:auth()});if(!r.ok){logout();return}loginBox.classList.add('hidden');appBox.classList.remove('hidden');who.textContent=(me?.username||'agent')+' · '+(me?.role||'');await loadStats();renderQueue(await r.json())}async function loadStats(){const r=await fetch('/agent/analytics',{headers:auth()});if(!r.ok)return;const s=await r.json();stats.innerHTML=[['Conversations',s.total_conversations],['Waiting',s.waiting_for_agent],['Human active',s.human_active],['Resolved',s.resolved]].map(x=>`<div class="stat"><div class="muted">${x[0]}</div><strong>${x[1]}</strong></div>`).join('')}function renderQueue(data){rows.innerHTML=data.map(c=>`<div class="item ${selected===c.id?'active':''}" onclick="openConversation('${c.id}')"><b>${c.user_id}</b><div class="muted">${c.channel} · ${c.assigned_agent||'unassigned'}</div><span class="pill">${c.status}</span></div>`).join('')}async function openConversation(id){selected=id;const [c,m]=await Promise.all([fetch('/agent/conversations',{headers:auth()}).then(r=>r.json()),fetch('/agent/conversations/'+id+'/messages',{headers:auth()}).then(r=>r.json())]);const item=c.find(x=>x.id===id);if(!item)return;empty.classList.add('hidden');panel.classList.remove('hidden');title.textContent=item.user_id;meta.textContent=item.channel+' · assigned: '+(item.assigned_agent||'nobody');status.textContent=item.status;msgs.innerHTML=m.map(x=>`<div class="msg ${x.role}"><b>${x.role}</b><br>${escapeHtml(x.text)}</div>`).join('');msgs.scrollTop=msgs.scrollHeight;renderQueue(c)}async function claim(){if(!selected)return;await fetch('/agent/conversations/'+selected+'/assign',{method:'POST',headers:{...auth(),'content-type':'application/json'},body:'{}'});await openConversation(selected);await loadStats()}async function setStatus(s){if(!selected)return;const r=await fetch('/agent/conversations/'+selected+'/status',{method:'PATCH',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify({status:s})});if(!r.ok){alert((await r.json()).detail||'Unable to update');return}await openConversation(selected);await loadStats()}async function sendReply(){const text=reply.value.trim();if(!selected||!text)return;const r=await fetch('/agent/conversations/'+selected+'/reply',{method:'POST',headers:{...auth(),'content-type':'application/json'},body:JSON.stringify({text})});if(!r.ok){alert((await r.json()).detail||'Unable to send');return}reply.value='';await openConversation(selected);await loadStats()}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}if(token&&me)show();setInterval(()=>{if(token){show();if(selected)openConversation(selected)}},5000);</script></body></html>
