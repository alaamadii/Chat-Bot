<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Dashboard</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:1100px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:16px}.row{display:grid;grid-template-columns:1.3fr .8fr .8fr 1fr;gap:12px;padding:12px 8px;border-top:1px solid #e2e8f0}.login{max-width:420px;margin:100px auto}.login input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:10px}.login button,.btn{padding:10px 14px;border:0;border-radius:10px;background:#0f172a;color:#fff;cursor:pointer}small{color:#64748b}.hidden{display:none}.status{font-weight:700;font-size:12px}</style></head><body><div id="loginBox" class="login card"><h2>Agent Login</h2><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button onclick="doLogin()">Sign in</button><p id="err"></p></div><div id="app" class="wrap hidden"><h1>Support Dashboard</h1><p><small>Live conversation queue</small></p><div class="card"><div class="row"><b>User</b><b>Channel</b><b>Status</b><b>Updated</b></div><div id="rows"></div></div></div><script>let token=localStorage.agentToken||'';const loginBox=document.getElementById('loginBox'),appBox=document.getElementById('app'),rowsBox=document.getElementById('rows');async function doLogin(){const r=await fetch('/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!r.ok){document.getElementById('err').textContent='Invalid credentials';return}const j=await r.json();token=j.access_token;localStorage.agentToken=token;show()}async function show(){const r=await fetch('/agent/conversations',{headers:{authorization:'Bearer '+token}});if(!r.ok){localStorage.removeItem('agentToken');return}loginBox.classList.add('hidden');appBox.classList.remove('hidden');const data=await r.json();rowsBox.innerHTML=data.map(c=>`<div class="row"><span>${c.user_id}</span><span>${c.channel}</span><span class="status">${c.status}</span><span>${new Date(c.updated_at).toLocaleString()}</span></div>`).join('')}if(token)show();</script></body></html>
