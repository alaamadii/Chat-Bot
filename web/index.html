<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextTech AI Support</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;display:grid;place-items:center;min-height:100vh}.app{width:min(760px,92vw);background:#111827;border:1px solid #334155;border-radius:20px;overflow:hidden}.head{padding:18px 22px;border-bottom:1px solid #334155}.msgs{height:58vh;overflow:auto;padding:20px}.m{padding:12px 14px;border-radius:14px;margin:9px 0;max-width:78%;line-height:1.45}.u{background:#2563eb;margin-left:auto}.b{background:#1e293b}.form{display:flex;gap:10px;padding:16px;border-top:1px solid #334155}.form input{flex:1;padding:13px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#fff}.form button{border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}</style></head><body><div class="app"><div class="head"><strong>NextTech AI Support</strong><div style="font-size:12px;color:#94a3b8">AI assistant · live backend</div></div><div id="msgs" class="msgs"><div class="m b">Hi! How can I help you today?</div></div><form id="form" class="form"><input id="input" placeholder="Type a message..." autocomplete="off"><button>Send</button></form></div><script>const id=localStorage.chatUser||('web-'+crypto.randomUUID());localStorage.chatUser=id;const msgs=document.getElementById('msgs');function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const i=document.getElementById('input'),text=i.value.trim();if(!text)return;add(text,'u');i.value='';try{const r=await fetch('/webhook/web',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({channel:'web_chat',user_id:id,text})});const j=await r.json();add(j.reply||'Something went wrong.','b')}catch{add('Unable to reach support right now.','b')}};</script></body></html>
